name: "Innovatech Infrastructure CI/CD"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    # This crucial line routes the job to your private AWS EC2 runner (REQ-NCA-P2-11)
    runs-on: self-hosted
    
    defaults:
      run:
        shell: bash

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Terraform Format Check"
        run: terraform fmt -check

      - name: "Terraform Init"
        run: terraform init

      - name: "Terraform Validate"
        run: terraform validate

      - name: "Terraform Plan"
        run: terraform plan -out=tfplan

      # Only apply the infrastructure if the push is on the main branch
      - name: "Terraform Apply"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan